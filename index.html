<!doctype html>
<!--
  lang="pt-BR" e translate="no": a aplicacao e inteiramente em portugues.

  Vinha `lang="en"` (heranca do template). O Chrome detectava o conteudo como
  portugues, via declarado ingles e, para quem tem "Sempre traduzir ingles"
  ligado, TRADUZIA a pagina automaticamente a cada visita, sem perguntar.

  Isso nao e cosmetico: o Google Tradutor nao pinta texto por cima, ele fatia
  cada no de texto, embrulha em <font> e reposiciona os nos. As referencias de
  DOM que o React guardou ficam obsoletas e o proximo re-render estoura com
  "Failed to execute 'insertBefore' on 'Node': The node before which the new
  node is to be inserted is not a child of this node" — o painel inteiro cai no
  ErrorBoundary. Aparecia so para um usuario, justamente o que tinha a
  traducao automatica ligada.
-->
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Trava a traducao mesmo se o usuario pedir manualmente: nao existe
         traducao segura de uma arvore React viva (ver comentario acima). -->
    <meta name="google" content="notranslate" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fonte carregada SEM bloquear a pintura.

      Como <link rel="stylesheet"> comum, esta folha era render-blocking: o
      navegador segurava a primeira pintura ate ela responder. Com o Google
      Fonts alcancavel isso custa ~100ms e passa despercebido; numa rede que
      bloqueia o dominio (proxy corporativo, filtro de conteudo) o navegador
      so desiste depois do timeout de conexao — medimos 13 SEGUNDOS de tela
      branca antes de qualquer coisa aparecer.

      O truque do media="print": a folha e baixada com prioridade baixa e nao
      se aplica a tela, entao nao bloqueia nada; quando termina, o onload a
      promove para todas as midias. A URL ja pede display=swap, entao o texto
      aparece na hora com a fonte de sistema e troca para a Outfit/Noto Serif
      quando ela chega. O <noscript> cobre quem esta sem JavaScript.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>FMP Analytics — Central de Dashboards</title>
    <!-- Configuracao de runtime: reescrito quando o container sobe, a partir das
         env vars. Script classico (nao module) para executar ANTES do bundle. -->
    <script src="/config.js"></script>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
